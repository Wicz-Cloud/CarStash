version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers: ["webwicz"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
  - package-ecosystem: "pip"
    directory: "/adapters"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers: ["webwicz"]
    commit-message:
      prefix: "deps"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers: ["webwicz"]
    commit-message:
      prefix: "ci"
      include: "scope"
